<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <h1 id="demo">Tôi là thành viên lớp BC76</h1>
    <img
      src="https://cdn-media.sforum.vn/storage/app/media/vantien/huskyflyaway/game-Chaos-Zero-Nightmare%20(1).jpg"
      alt=""
      id="hinhAnh"
    />
    <p id="txtText">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, iste?
    </p>
    <div class="container">
      <h3 class="demo2">Tôi là H3 thứ nhất</h3>
      <h3>Tôi là H3 thứ 2</h3>

      <div>
        <h2>Bài tập lấy dữ liệu người dùng</h2>
        <div class="mb-3">
          <label for="taiKhoan" class="form-label">Tài khoản</label>
          <input
            type="text"
            class="form-control"
            name=""
            id="taiKhoan"
            aria-describedby="helpId"
            placeholder="Vui lòng nhập tài khoản"
          />
        </div>
        <div class="mb-3">
          <label for="matKhau" class="form-label">Mật khẩu</label>
          <input
            type="password"
            class="form-control"
            name=""
            id="matKhau"
            aria-describedby="helpId"
            placeholder="Vui lòng nhập mật khẩu"
          />
        </div>
        <button class="btn btn-dark">Đăng nhập</button>
      </div>

      <div class="mt-5">
        <h2>Bài tập bật tắt bóng đèn</h2>
        <button class="btn btn-danger">Tắt đèn</button>
        <img
          src="./img/pic_bulboff.gif"
          style="border: 2px solid red"
          alt=""
          id="hinhBongDen"
        />
        <button class="btn btn-success">Bật đèn</button>
      </div>
    </div>
    <h3 id="demo_class">Demo tương tác class trong js</h3>
    <button class="btn btn-primary">Thêm một class vào H3</button>

    <div class="demo_add_html">
      <h2>Hướng dẫn tạo html từ JavaScript</h2>
    </div>

    <br /><br /><br /><br /><br /><br /><br /><br /><br /><br />
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- MAIN JS -->
    <script src="./index.js"></script>
  </body>
</html>
