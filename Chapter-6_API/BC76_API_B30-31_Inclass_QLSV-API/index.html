<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Toastify-JS CDN CSS -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>

  <body>
    <div class="container py-5">
      <form id="QLSV-API">
        <h2 class="text-center">Bài tập quản lý sinh viên API</h2>
        <div class="row">
          <div class="col-6">
            <div class="mb-3">
              <label for="maSinhVien" class="form-label">Mã Sinh Viên</label>
              <input
                type="text"
                class="form-control"
                name=""
                id="maSinhVien"
                aria-describedby="helpId"
                placeholder="Vui lòng nhập mã sinh viên"
              />
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="tenSinhVien" class="form-label">Tên sinh viên</label>
              <input
                type="text"
                class="form-control"
                name=""
                id="tenSinhVien"
                aria-describedby="helpId"
                placeholder="Vui lòng nhập tên sinh viên"
              />
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="diemRenLuyen" class="form-label"
                >Điểm rèn luyện</label
              >
              <input
                type="text"
                class="form-control"
                name=""
                id="diemRenLuyen"
                aria-describedby="helpId"
                placeholder="Vui lòng nhập điểm rèn luyện"
              />
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="loaiSinhVien" class="form-label">Xếp loại</label>
              <select
                class="form-select form-select-lg"
                name=""
                id="loaiSinhVien"
              >
                <option selected>Loại sinh viên</option>
                <option value="Giàu">Giàu</option>
                <option value="Nghèo">Nghèo</option>
              </select>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="text"
                class="form-control"
                name=""
                id="email"
                aria-describedby="helpId"
                placeholder="Vui lòng nhập email"
              />
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="soDienThoai" class="form-label">Số điện thoại</label>
              <input
                type="text"
                class="form-control"
                name=""
                id="soDienThoai"
                aria-describedby="helpId"
                placeholder="Vui lòng nhập số điện thoại"
              />
            </div>
          </div>
          <div class="col-4">
            <div class="mb-3">
              <label for="diemToan" class="form-label">Điểm toán</label>
              <input
                type="text"
                class="form-control"
                name=""
                id="diemToan"
                aria-describedby="helpId"
                placeholder="Vui lòng nhập điểm toán"
              />
            </div>
          </div>
          <div class="col-4">
            <div class="mb-3">
              <label for="diemLy" class="form-label">Điểm lý</label>
              <input
                type="text"
                class="form-control"
                name=""
                id="diemLy"
                aria-describedby="helpId"
                placeholder="Vui lòng nhập điểm lý"
              />
            </div>
          </div>
          <div class="col-4">
            <div class="mb-3">
              <label for="diemHoa" class="form-label">Điểm hóa</label>
              <input
                type="text"
                class="form-control"
                name=""
                id="diemHoa"
                aria-describedby="helpId"
                placeholder="Vui lòng nhập điểm hóa"
              />
            </div>
          </div>
        </div>
        <div class="text-center">
          <button class="btn btn-success" type="submit">Thêm người dùng</button>
          <button class="btn btn-dark" type="button">Reset</button>
          <button class="btn btn-primary" type="button">Cập nhật</button>
        </div>
      </form>

      <div class="table-responsive mt-5">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">Mã Sinh Viên</th>
              <th scope="col">Tên Sinh Viên</th>
              <th scope="col">Email</th>
              <th scope="col">Số điện thoại</th>
              <th scope="col">Loại sinh viên</th>
              <th scope="col">Điểm trung bình</th>
              <th scope="col">Hành động</th>
            </tr>
          </thead>
          <tbody id="tableSV">
            <tr class="">
              <td scope="row">SE140</td>
              <td>Nguyễn Lê Minh Thành</td>
              <td>thanhnlmvn@gmail.com</td>
              <td>0909313067</td>
              <td>Nghèo</td>
              <td>9</td>
              <td>
                <button class="btn btn-danger">Xóa</button>
                <button class="btn btn-warning">Sửa</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Axios CDN JS -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"
      integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <!-- Toastify-JS CDN JS -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <!-- MAIN JS -->
    <script src="./js/index.js"></script>
  </body>
</html>
